name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: Notice visibility tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run the test suite
      run: python -m unittest discover --start-directory tests --verbose

    - name: Byte-compile the package
      run: python -m compileall -q permissions utils views serializers
